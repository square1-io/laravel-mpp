providers:
  - Square1\Mpp\MppServiceProvider

# The in-repo conformance demo (see README "Validating Conformance"):
#   STRIPE_SECRET_KEY=sk_test_… STRIPE_NETWORK_ID=profile_test_… \
#     vendor/bin/testbench serve --host=127.0.0.1 --port=4242
#   MPPX_STRIPE_SECRET_KEY=sk_test_… \
#     npx mppx@latest validate http://127.0.0.1:4242 --endpoint GET:/paid --yes
# Stripe keys come from the shell on purpose — never commit them here.
# Tempo settings are the Moderato TESTNET pairing (chain 42431 + the
# 0x20c0…0000 token); mixing nets reverts `TIP20: Uninitialized`.
env:
  - MPP_CHALLENGE_SECRET="e2e-tempo-demo-secret-not-for-production"
  - CACHE_STORE=file
  - MPP_ACCEPT="stripe|tempo"
  # The local demo serves over http://127.0.0.1:4242; production requires TLS.
  - MPP_ALLOW_INSECURE=true
  - TEMPO_RPC_URL=https://rpc.moderato.tempo.xyz
  - TEMPO_CHAIN_ID=42431
  - TEMPO_TOKEN=0x20c0000000000000000000000000000000000000
  - TEMPO_DECIMALS=6
  - TEMPO_RECIPIENT=0x0dcd39A3F85aa288C1B2825bc41EB7e9BB2ABF70
  - TEMPO_MIN_CONFIRMATIONS=1
  - TEMPO_POLL_ATTEMPTS=60
  - TEMPO_POLL_DELAY_MS=1000

workbench:
  start: '/paid'
  install: true
  discovers:
    web: true
